<style>

#dot.on{background:#30a46c}

.full{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:inherit;background-color:#101319}
body.light .full{background-color:#eef0f4}

<script>// shared by the leader screen and the musician page

const KEYHE={C:'דו',D:'רה',E:'מי',F:'פה',G:'סול',A:'לה',B:'סי'};

G.MNC={INSTS,instHe,partFor,songKey,keyShow,splitKey,esc,notesFor};

<script>
'use strict';
(function(){
const $=id=>document.getElementById(id),{INSTS,instHe,partFor,songKey,esc}=MNC;
const SS={g(k){try{return sessionStorage.getItem(k)}catch(e){return null}},s(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let me={inst:LS.g('mnl_inst')||'',name:LS.g('mnl_name')||''},myId=0;
// opened from the MyNotes app on a musician's tablet: the app already knows the instrument
const APP=!!(window.MNHost&&typeof MNHost.home==='function');{const u=new URLSearchParams(location.search),ui=u.get('inst');if(ui&&INSTS.some(i=>i.id===ui)){me.inst=ui;LS.s('mnl_inst',ui)}const un=u.get('name');if(un!=null){me.name=un;LS.s('mnl_name',un)}}
// a tablet that joins by the code is asked for its instrument every time it joins; inside the app the app already knows
let asked=APP||SS.g('mnl_ok')==='1';const needPick=()=>!me.inst||!asked;
let lib={songs:{}},libRev=-1,st=null,mine=null,shown={id:null,key:null,b:null},ws=null,lastPong=0,topT=0,cueT=0;
const blobs=new Map();
pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
const view=new SheetView($('view'),{pdfjs:async()=>pdfjsLib,onPage:(p,n)=>{$('pgs').textContent=n>1?p+' / '+n:'';report()}});
view.setFit(LS.g('mnl_fit')==='width'?'width':'page');

// ----- connection -----
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function hello(){send({t:'hello',inst:me.inst,name:me.name})}
function report(){if(!shown.id)return;clearTimeout(report.t);report.t=setTimeout(()=>send({t:'pos',song:shown.id,page:view.page,pages:view.n}),150)}
let offSince=0;
function online(on){$('dot').classList.toggle('on',on);$('lost').hidden=on||!st;if(on)offSince=0;else if(!offSince)offSince=Date.now();rsc()}
// in the app: when the leader cannot be reached for a while (another network, a new address), offer to look for him again
function rsc(){const show=APP&&offSince&&Date.now()-offSince>12000;$('rescan').hidden=!show;$('rescan2').hidden=!show}
setInterval(rsc,2000);document.querySelectorAll('.rsc').forEach(b=>b.onclick=e=>{e.stopPropagation();try{MNHost.home('')}catch(_){}});
if(APP)window.MNBack=()=>{if(!$('menu').hidden)closeMenu();else if($('pick').hidden)openMenu()};
function connect(){try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){setTimeout(connect,2000);return}
 const w=ws;w.onopen=()=>{lastPong=Date.now();online(true);if(!needPick())hello();loadLib()};
 w.onclose=()=>{if(ws!==w)return;online(false);setTimeout(connect,1500)};w.onerror=()=>{try{w.close()}catch(e){}};
 w.onmessage=ev=>{lastPong=Date.now();if(ev.data==='p')return;let m;try{m=JSON.parse(ev.data)}catch(e){return}on(m)}}
setInterval(()=>{if(ws&&ws.readyState===1){ws.send('p');if(Date.now()-lastPong>13000){try{ws.close()}catch(e){}}}},4000);
async function loadLib(){try{const r=await fetch('/kv/library',{cache:'no-store'});if(!r.ok)return;const j=await r.json();lib=j;libRev=j.rev||0;refresh();preload()}catch(e){}}
function on(m){
 if(m.t==='id'){myId=m.id;return}
 if(m.t==='state'){const first=!st;const was=st;st=m;if(m.lib!=null&&m.lib!==libRev)loadLib();
  if(first||!mine||(was&&was.sid!==st.sid)||(st.mode==='push'&&was&&(was.cur!==st.cur||was.key!==st.key)))mine=null;
  {const ps=st.ps||{},d=document.documentElement.style;d.setProperty('--cuec',ps.cueC||'#d21f3c');d.setProperty('--cues',(ps.cueS||54)+'px');d.setProperty('--banc',ps.banC||'#d21f3c')}
  document.body.classList.toggle('light',st.theme==='light');refresh();preload();return}
 if(m.t==='song'){if(m.song){lib.songs[m.song.id]=m.song}else if(m.id)delete lib.songs[m.id];if(m.rev)libRev=m.rev;refresh(true);return}
 if(m.t==='lib'){loadLib();return}
 if(m.t==='call'){mine=null;const go=()=>{if(m.pos==null||!view.n)return;if(view.fit==='page')view.go(Math.min(view.n,Math.floor(m.pos*view.n+0.001)+1));else view.root.scrollTop=m.pos*view.root.scrollHeight};Promise.resolve(refresh()).then(go,go);flashTop();return}
 if(m.t==='who'){if(!needPick())hello();report();return}
 if(m.t==='inst'&&m.inst){setInst(m.inst,true);return}
 if(m.t==='cue'){cue(m.txt,m.kind);return}
 if(m.t==='point'){if(shown.id===m.song&&shown.b)view.flash(m.bar,2800);return}
 if(m.t==='reload'){location.reload();return}}

// ----- what to show -----
function target(){if(!st)return null;if(mine&&lib.songs[mine.id])return mine;if(st.cur)return {id:st.cur,key:st.key||null};return null}
// files that were opened once stay on this tablet (their names never repeat for a different content)
let cdb=null;function cacheDb(){return cdb||(cdb=new Promise(res=>{try{const r=indexedDB.open('mnl-cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}}))}
async function cGet(k){const d=await cacheDb();if(!d)return null;return new Promise(res=>{try{const q=d.transaction('b').objectStore('b').get(k);q.onsuccess=()=>res(q.result&&q.result.d||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
async function cPut(k,buf){const d=await cacheDb();if(!d)return;try{const t=d.transaction('b','readwrite'),o=t.objectStore('b');o.put({d:buf,t:Date.now()},k);const c=o.count();c.onsuccess=()=>{if(c.result>900){let n=c.result-700;const cur=o.openCursor();cur.onsuccess=()=>{const x=cur.result;if(x&&n-->0){x.delete();x.continue()}}}}}catch(e){}}
async function blob(key){if(blobs.has(key))return blobs.get(key);const p=cGet(key).then(c=>c||fetch('/b/'+key).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>{cPut(key,b);return b}));blobs.set(key,p);p.catch(()=>blobs.delete(key));if(blobs.size>60){const k=blobs.keys().next().value;if(k!==key)blobs.delete(k)}return p}
const notesFor=MNC.notesFor;
async function refresh(force){
 $('pick').hidden=!needPick();waitBtn();if(needPick()){$('wait').hidden=true;return}
 const t=target(),song=t&&lib.songs[t.id];
 if(!st){$('wait').hidden=false;$('waitMsg').textContent='ממתין למנצח…';return}
 if(!t||!song){$('wait').hidden=false;$('waitMsg').textContent=st.name?('מחובר · '+st.name):'מחובר. ממתין לשיר הראשון…';shown={id:null};$('ban').hidden=true;return}
 const key=song.keys?(t.key||(st.cur===t.id&&st.key)||null):null,part=partFor(song,me.inst,key);
 $('ttl').textContent=song.t||'';const kk=part&&part.kn||songKey(song,key);$('key').textContent=kk;$('key').hidden=!kk;$('who').textContent=instHe(me.inst);
 const ban=(song.notes||[]).filter(n=>n.kind==='banner').map(n=>n.txt).join('  ·  ');$('ban').textContent=ban;$('ban').hidden=!ban;
 if(part&&part.wait&&shown.id===t.id&&shown.b&&view.n){$('busy').textContent='מכין את הסולם '+(key||'')+'…';$('busy').hidden=false;$('wait').hidden=true;return}
 $('busy').hidden=true;
 if(!part||part.wait){$('wait').hidden=false;$('waitMsg').textContent=part?('מכין את התפקיד של "'+(song.t||'')+'"…'):('אין תווים ל'+instHe(me.inst)+' בשיר "'+(song.t||'')+'"');shown={id:t.id,key,b:null};return}
 if(shown.id===t.id&&shown.b===part.b){view.setNotes(notesFor(song,part));if(!force)return;return}
 const same=shown.id===t.id,pg=same?view.page:1;shown={id:t.id,key,b:part.b};
 try{const [buf,map]=await Promise.all([blob(part.b),part.m?blob(part.m).then(b=>JSON.parse(new TextDecoder().decode(b))).catch(()=>null):null]);if(shown.b!==part.b)return;
  await view.open(part,buf,{page:pg,map,notes:notesFor(song,part)});if(shown.b!==part.b)return;$('wait').hidden=true;report()}
 catch(e){if(shown.b===part.b){$('wait').hidden=false;$('waitMsg').textContent='התווים עוד לא ירדו. מנסה שוב…';shown.b=null;setTimeout(()=>refresh(),2000)}}}
let preT=0;function preload(){clearTimeout(preT);preT=setTimeout(async()=>{if(!st||!me.inst)return;const L=(st.list||[]).slice(),i=Math.max(0,L.indexOf(st.cur));const ord=L.slice(i).concat(L.slice(0,i)).slice(0,45);
 for(const id of ord){const s=lib.songs[id];if(!s)continue;const p=partFor(s,me.inst,id===st.cur?st.key:null);if(p&&p.b){try{await blob(p.b)}catch(e){}}}},600)}
function flashTop(ms){$('top').classList.remove('off');clearTimeout(topT);topT=setTimeout(()=>{if($('menu').hidden)$('top').classList.add('off')},ms||3500)}
function cue(txt,kind){const c=$('cue');c.textContent=txt||'';c.hidden=!txt;clearTimeout(cueT);if(txt)cueT=setTimeout(()=>c.hidden=true,3500)}

// ----- instrument -----
function setInst(id,quiet){asked=true;SS.s('mnl_ok','1');me.inst=id;LS.s('mnl_inst',id);if(APP){try{MNHost.setPref('inst',id)}catch(e){}}me.name=$('nm').value.trim()||me.name;LS.s('mnl_name',me.name);$('pick').hidden=true;shown={id:null};hello();refresh();if(!quiet)awake()}
$('insts').innerHTML=INSTS.filter(i=>i.id!=='gen').map(i=>'<button data-i="'+i.id+'"'+(i.id===me.inst?' class="prev"':'')+'>'+esc(i.he)+'</button>').join('');$('nm').value=me.name;
$('insts').onclick=e=>{const b=e.target.closest('button');if(b)setInst(b.dataset.i)};

// ----- keep the screen on -----
let lock=null,ns=null;async function awake(){try{if(navigator.wakeLock){lock=await navigator.wakeLock.request('screen');return}}catch(e){}try{if(!ns)ns=new NoSleep();await ns.enable()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){awake();if(!ws||ws.readyState>1)connect()}});

// ----- the waiting screen must never be a dead end: the instrument can always be changed from it -----
function waitBtn(){const b=$('waitInst');b.hidden=needPick();if(me.inst)b.textContent='הכלי שלי: '+instHe(me.inst)+' · החלפה'}
$('waitInst').onclick=e=>{e.stopPropagation();$('nm').value=me.name;me.inst='';LS.s('mnl_inst','');$('pick').hidden=false;$('wait').hidden=true};
// ----- full screen from the first touch (a browser never allows it before one) -----
let fsDone=false;function goFs(){if(fsDone)return;fsDone=true;try{const d=document.documentElement;if(!document.fullscreenElement&&!document.webkitFullscreenElement){const f=d.requestFullscreen||d.webkitRequestFullscreen;if(f){const r=f.call(d,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}}}catch(e){}}
document.addEventListener('pointerup',goFs,true);
// ----- touch -----
let down=null;const stage=$('stage');
stage.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:Date.now()}});
stage.addEventListener('pointerup',e=>{if(!down)return;if(view.zoomed){down=null;return}const dx=e.clientX-down.x,dy=e.clientY-down.y,dt=Date.now()-down.t;down=null;awake();
 if(Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy)&&view.fit==='page'){dx<0?turn(1):turn(-1);return}
 if(Math.abs(dx)>12||Math.abs(dy)>12||dt>700)return;const Z=Math.min(76,innerWidth*0.18),px=e.clientX;
 if(px>innerWidth-Z){turn(1);return}if(px<Z){turn(-1);return}openMenu()});
function turn(d){if(view.fit!=='page'){d>0?view.next():view.prev();return}const ok=d>0?view.next():view.prev();if(!ok&&st&&st.mode==='free'){const L=st.list||[],t=target(),i=!t?-1:mine&&mine.pos!=null&&L[mine.pos]===t.id?mine.pos:!mine&&L[st.pos]===t.id?st.pos:L.indexOf(t.id);const n=L[i+d];if(i>=0&&n&&lib.songs[n]){mine={id:n,key:null,pos:i+d};refresh()}}}
addEventListener('keydown',e=>{if(!$('menu').hidden||!$('pick').hidden)return;const k=e.key;if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){e.preventDefault();turn(1)}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();turn(-1)}});

// ----- menu -----
let menuAt=0;const fresh=()=>Date.now()-menuAt<500;
function openMenu(){menuAt=Date.now();$('menu').hidden=false;$('top').classList.remove('off');
 $('acts').innerHTML='<button data-a="fit">'+(view.fit==='page'?'רוחב מלא (גלילה)':'עמוד שלם')+'</button><button data-a="fs">מסך מלא</button><button data-a="inst">כלי: '+esc(instHe(me.inst))+'</button>'+(APP?'<button data-a="dev">הגדרות המכשיר</button>':'')+(mine&&st&&st.cur?'<button data-a="back">חזרה לשיר של המנצח</button>':'')+'<button data-a="x">סגור</button>';
 $('q').value='';list('')}
function closeMenu(){$('menu').hidden=true;flashTop(1500)}
function list(q){const L=$('list'),t=target();let h='';q=q.trim().toLowerCase();const push=st&&st.mode!=='free';
 const row=(s,n)=>'<button class="it'+(t&&t.id===s.id?' cur':'')+'" data-id="'+s.id+'"><span class="n">'+(n||'')+'</span><span class="t">'+esc(s.t)+'</span><span class="k">'+esc(songKey(s,null))+'</span></button>';
 const all=Object.values(lib.songs).sort((a,b)=>(a.t||'').localeCompare(b.t||'','he'));
 if(!q){const ids=(st&&st.list)||[];if(ids.length)h+='<div class="hd">רשימת הערב'+(push?' · כשהמנצח מעביר שיר, כולם עוברים איתו':'')+'</div>';ids.forEach((id,i)=>{const s=lib.songs[id];if(s)h+=row(s,i+1)});if(all.length){h+='<div class="hd">כל השירים · '+all.length+'</div>';all.forEach(s=>h+=row(s))}}
 else{const f=all.filter(s=>(s.t||'').toLowerCase().includes(q)||(s.o||'').toLowerCase().includes(q)).slice(0,120);h+='<div class="hd">'+f.length+' תוצאות</div>';f.forEach(s=>h+=row(s))}
 L.innerHTML=h||'<div class="hd">הרשימה ריקה</div>';const c=L.querySelector('.cur');if(c)c.scrollIntoView({block:'center'})}
$('q').oninput=()=>list($('q').value);
$('list').onclick=e=>{if(fresh())return;const b=e.target.closest('.it');if(!b||b.disabled)return;mine={id:b.dataset.id,key:null};closeMenu();refresh()};
$('menu').onclick=e=>{if(fresh())return;if(e.target===$('menu'))closeMenu()};
$('acts').onclick=e=>{if(fresh())return;const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='fit'){const f=view.fit==='page'?'width':'page';LS.s('mnl_fit',f);view.setFit(f);closeMenu()}
 else if(a==='fs'){const d=document.documentElement;try{document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(_){}closeMenu()}
 else if(a==='inst'){closeMenu();$('pick').hidden=false}
 else if(a==='back'){mine=null;closeMenu();refresh()}
 else if(a==='dev'){try{MNHost.home('settings')}catch(_){}}
 else closeMenu()};
$('pick').hidden=!needPick();connect();
})();
</script></body></html>
