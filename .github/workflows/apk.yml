name: Build tablet app (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Put the web app inside the tablet app
        run: |
          W=android/app/src/main/assets/www
          mkdir -p $W/app
          cp index.html sw.js manifest.webmanifest *.png $W/app/
          cp -r vendor $W/app/vendor
          cp -r player $W/player
          cp -r join $W/join
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease -PverCode=${{ github.run_number }}
      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk MyNotes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyNotes-apk
          path: MyNotes.apk
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: MyNotes for the tablet (build ${{ github.run_number }})
          body: Download MyNotes.apk on the tablet and install it. It installs over the previous version and keeps the library.
          files: MyNotes.apk
          make_latest: true
