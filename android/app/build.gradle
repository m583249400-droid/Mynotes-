plugins { id 'com.android.application' }
android {
    namespace 'mn.live'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mendybrandwin.mynotes'
        minSdk 24
        targetSdk 36
        versionCode((project.findProperty('verCode') ?: '1') as Integer)
        versionName "1." + (project.findProperty('verCode') ?: '0')
    }
    // one fixed key kept with the project, so every new build installs over the previous one and the library stays
    signingConfigs {
        release { storeFile file('../mynotes.keystore'); storePassword 'mynotes-live'; keyAlias 'mynotes'; keyPassword 'mynotes-live' }
        // the Google Play upload key: kept only as a secret of the build, never in the project
        upload { if (project.hasProperty('uploadKs')) { storeFile file(project.property('uploadKs')); storePassword project.property('uploadPw'); keyAlias 'upload'; keyPassword project.property('uploadPw') } }
    }
    buildTypes { release { minifyEnabled false; signingConfig project.hasProperty('uploadKs') ? signingConfigs.upload : signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false; checkReleaseBuilds false }
    androidResources { noCompress 'html', 'js', 'wasm' }
}
